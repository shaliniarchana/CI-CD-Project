name: Hotel Project CI-CD

on:
  push:
    branches: [ main ] # The robot wakes up when you push to 'main'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Integration (CI): Get the code and check it
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build
        run: |
          npm install
          npm run build

      # 2. Deployment (CD): Upload to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist